services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rescue
      POSTGRES_PASSWORD: rescue
      POSTGRES_DB: rescue_router
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescue -d rescue_router"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pg_data:
